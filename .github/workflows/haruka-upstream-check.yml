name: Haruka upstream check
# Trial-merges mihonapp/mihon main into dev every day and reports what would break, before the weekly sync
# (haruka-upstream-sync.yml) opens a PR. Opens one "Upstream drift at <sha>" issue per upstream commit; closes
# them once upstream merges cleanly. Never pushes or opens a PR.
on:
  schedule:
    - cron: '30 2 * * *' # daily 02:30 UTC, ahead of the Monday 03:00 UTC sync
  workflow_dispatch:

concurrency:
  group: haruka-upstream-check
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository == 'hoshinoht/haruka'
    runs-on: 'ubuntu-26.04'
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/mihonapp/mihon.git
          git fetch --no-tags upstream main
          echo "short=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check upstream drift
        id: drift
        if: steps.upstream.outputs.skip == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          scripts/haruka/upstream-drift.sh upstream/main 2>&1 | tee "$RUNNER_TEMP/drift.txt"

      - name: Trial merge
        id: merge
        if: steps.upstream.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge --no-ff --no-commit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.merge.outputs.conflict == 'false'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build merged tree
        id: build
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew spotlessCheck :app:compileDebugKotlin testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report
        if: ${{ !cancelled() && steps.upstream.outputs.skip == 'false' }}
        env:
          SHORT: ${{ steps.upstream.outputs.short }}
          DRIFT: ${{ steps.drift.outcome }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          open_drift_issues() {
            gh issue list --state open --limit 100 --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
              awk -F'\t' -v prefix="$1" 'index($2, prefix) == 1 { print $1 }'
          }

          if [ "$DRIFT" = success ] && [ "$CONFLICT" = false ] && [ "$BUILD" = success ]; then
            for number in $(open_drift_issues "Upstream drift at "); do
              gh issue close "$number" --comment "\`mihonapp/mihon@${SHORT}\` merges into \`dev\` cleanly, builds and passes the drift check."
            done
            exit 0
          fi

          title="Upstream drift at ${SHORT}"
          if [ -n "$(open_drift_issues "$title")" ]; then
            echo "Issue already open"; exit 0
          fi
          {
            echo "Daily trial merge of \`mihonapp/mihon@${SHORT}\` into \`dev\`: drift check **${DRIFT}**, conflicts **${CONFLICT:-unknown}**, build (\`spotlessCheck :app:compileDebugKotlin testDebugUnitTest\`) **${BUILD:-skipped}**."
            echo
            if [ -s "$RUNNER_TEMP/drift.txt" ]; then
              echo '### Drift (`scripts/haruka/upstream-drift.sh upstream/main`)'
              echo '```'; cat "$RUNNER_TEMP/drift.txt"; echo '```'
            fi
            if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
              echo '### Conflicts'
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            fi
            if [ -s "$RUNNER_TEMP/build.log" ] && [ "$BUILD" != success ]; then
              echo '### Build (last 60 lines)'
              echo '```'; tail -n 60 "$RUNNER_TEMP/build.log"; echo '```'
            fi
            echo
            echo "Rule 4: if upstream now ships a fork feature, decommission it per \`docs/haruka/FEATURES.md\`."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "${title}" --body-file "$RUNNER_TEMP/body.md"
