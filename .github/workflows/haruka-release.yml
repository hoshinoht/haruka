name: Haruka release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'hoshinoht/haruka'
    name: Build and draft release
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read tag
        id: tag
        run: |
          set -e
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          app_version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$version" != "$app_version" ]; then
            echo "::error::Tag $tag does not match versionName $app_version in app/build.gradle.kts"
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/haruka-release.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github
        env:
          storeFile: ${{ runner.temp }}/haruka-release.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          set -e
          out=app/build/outputs/apk/release
          mv $out/app-universal-release.apk haruka-${{ steps.tag.outputs.tag }}.apk
          mv $out/app-arm64-v8a-release.apk haruka-arm64-v8a-${{ steps.tag.outputs.tag }}.apk
          sha256sum haruka-*.apk > SHA256SUMS.txt

      - name: Release notes
        run: |
          set -e
          # Section of docs/haruka/CHANGELOG.md for this version, up to the next "## " heading.
          awk -v v="${{ steps.tag.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' docs/haruka/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## [${{ steps.tag.outputs.version }}]' section in docs/haruka/CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "Based on Mihon $(sed -n 's/.*MIHON_VERSION", "\\"\(.*\)\\"").*/\1/p' app/build.gradle.kts)."
            echo
            echo "> [!TIP]"
            echo "> Most phones want \`haruka-arm64-v8a-${{ steps.tag.outputs.tag }}.apk\`; \`haruka-${{ steps.tag.outputs.tag }}.apk\` works everywhere."
          } >> notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Haruka ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          files: |
            haruka-${{ steps.tag.outputs.tag }}.apk
            haruka-arm64-v8a-${{ steps.tag.outputs.tag }}.apk
            SHA256SUMS.txt
          draft: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
