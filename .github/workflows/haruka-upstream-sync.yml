name: Haruka upstream sync
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: haruka-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: github.repository == 'hoshinoht/haruka'
    runs-on: 'ubuntu-26.04'
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mihonapp/mihon.git
          git fetch --no-tags upstream main

      - name: Mirror upstream main
        # Fast-forward only: fails loudly if someone committed to main.
        run: git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Prepare merge branch
        id: prep
        run: |
          short="$(git rev-parse --short upstream/main)"
          branch="sync/upstream-${short}"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "skip=up-to-date" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
            echo "skip=branch-exists" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.prep.outputs.skip == ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "${{ steps.prep.outputs.branch }}"
          if git merge --no-ff --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        run: |
          title="Upstream sync conflict at ${{ steps.prep.outputs.short }}"
          if gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Issue already open"; exit 0
          fi
          {
            echo "Merging \`mihonapp/mihon@${{ steps.prep.outputs.short }}\` into \`develop\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve locally: \`git fetch upstream && git switch -c ${{ steps.prep.outputs.branch }} origin/develop && git merge upstream/main\`."
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "${title}" --body-file "$RUNNER_TEMP/body.md"

      - name: Set up JDK
        if: steps.merge.outputs.conflict == 'false'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        if: steps.merge.outputs.conflict == 'false'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Verify merge
        id: verify
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: ./gradlew spotlessCheck testDebugUnitTest assembleDebug

      - name: Open pull request
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin "${{ steps.prep.outputs.branch }}"
          {
            echo "Merges \`mihonapp/mihon@${{ steps.prep.outputs.short }}\` into \`develop\`."
            echo
            echo "Checks (\`spotlessCheck testDebugUnitTest assembleDebug\`): **${{ steps.verify.outcome }}**"
            echo
            echo '```'
            scripts/haruka/patch-surface.sh upstream/main
            echo '```'
            echo
            echo "Before merging: run the extension and backup compatibility smoke on a device."
          } > "$RUNNER_TEMP/body.md"
          draft=""
          [ "${{ steps.verify.outcome }}" = "success" ] || draft="--draft"
          gh pr create --base develop --head "${{ steps.prep.outputs.branch }}" \
            --title "Sync upstream ${{ steps.prep.outputs.short }}" --body-file "$RUNNER_TEMP/body.md" ${draft}
