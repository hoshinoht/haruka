# Haruka's release version, read by gradle/build-logic/src/main/kotlin/haruka/gradle/HarukaApp.kt,
# scripts/haruka/build-release.sh and .github/workflows/haruka-release.yml.
# versionCode = major*1_000_000 + minor*10_000 + patch*100 + beta number (99 for a stable release).
versionCode=10006
versionName=0.1.0-beta.6
# Upstream Mihon this build is based on: Haruka follows mihonapp/mihon main, which runs ahead of the last
# release tag. Update on each upstream sync merge.
mihonBase=0.21.3 (e588e04)
